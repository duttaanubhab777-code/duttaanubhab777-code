(-100%)</tspan>   <tspan fill="#262d5c">│</tspan>   <tspan fill="#5b6490">STREAK</tspan> <tspan fill="#e8ebff" font-weight="700">25d</tspan> <tspan fill="#ffb347">■</tspan> <tspan fill="#ffb347">BEST 25d</tspan>   <tspan fill="#262d5c">│</tspan>   <tspan fill="#5b6490">COMMITS</tspan> <tspan fill="#e8ebff" font-weight="700">490</tspan>   <tspan fill="#262d5c">│</tspan>   <tspan fill="#5b6490">PULL·REQ</tspan> <tspan fill="#e8ebff" font-weight="700">3</tspan>   <tspan fill="#262d5c">│</tspan>   <tspan fill="#5b6490">REPOS</tspan> <tspan fill="#e8ebff" font-weight="700">13</tspan>   <tspan fill="#262d5c">│</tspan>   <tspan fill="#5b6490">STARS</tspan> <tspan fill="#e8ebff" font-weight="700">5</tspan>   <tspan fill="#262d5c">│</tspan>   <tspan fill="#5b6490">FOLLOWERS</tspan> <tspan fill="#e8ebff" font-weight="700">2</tspan>   <tspan fill="#262d5c">│</tspan>   <tspan fill="#5b6490">TOP·LANG</tspan> <tspan fill="#e8ebff" font-weight="700">JavaScript</tspan> <tspan fill="#9aa3c7">54.6%</tspan>   <tspan fill="#262d5c">│</tspan>   </text></g></g>
<rect x="100" y="1" width="40" height="36" fill="url(#fl)"/>
<rect x="960" y="1" width="39" height="36" fill="url(#fr)"/>
<rect x="1" y="1" width="99" height="36" rx="9" fill="#0f1330"/>
<circle cx="24" cy="19" r="5" fill="#3ddc84"/><circle class="ring" cx="24" cy="19" r="5" fill="none" stroke="#3ddc84" stroke-width="1.5"/><text class="m" x="38" y="23" fill="#3ddc84" font-size="12" font-weight="700" letter-spacing="2">LIVE</text>
</svg>
