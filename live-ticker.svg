<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 38" width="100%">
<title>Live ticker</title>
<defs>
<clipPath id="clip"><rect x="100" y="0" width="900" height="38"/></clipPath>
<linearGradient id="fl" x1="0" x2="1"><stop offset="0" stop-color="#0a0d22"/><stop offset="1" stop-color="#0a0d22" stop-opacity="0"/></linearGradient>
<linearGradient id="fr" x1="0" x2="1"><stop offset="0" stop-color="#0a0d22" stop-opacity="0"/><stop offset="1" stop-color="#0a0d22"/></linearGradient>
</defs>
<style>
.m{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
.ring{transform-box:fill-box;transform-origin:center;animation:ring 1.8s ease-out infinite}
@keyframes ring{0%{transform:scale(1);opacity:.8}100%{transform:scale(3.2);opacity:0}}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.soft{animation:soft 2.4s ease-in-out infinite}
@keyframes soft{50%{opacity:.45}}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 2.4s ease-out .3s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.fade{animation:fade .9s ease-out both}
@keyframes fade{from{opacity:0}}

.tk{animation:tk 36s linear infinite}
@keyframes tk{to{transform:translateX(-1615px)}}
</style>
<rect width="1000" height="38" rx="10" fill="#0a0d22" stroke="#262d5c"/>
